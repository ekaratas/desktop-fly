[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trader-fly"
version = "0.1.0"
description = "Drosophila mushroom-body-inspired trading organism: research prototype, no live trading"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["trader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
